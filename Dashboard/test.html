<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="card border-0 shadow-sm bg-primary text-white">
      <div class="card-body">
        <h6 class="card-title opacity-75">總銷售金額</h6>
        <h3 class="card-text">$52,480</h3>
        <small><i class="bi bi-arrow-up"></i> 比上月增長 12%</small>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm bg-success text-white">
      <div class="card-body">
        <h6 class="card-title opacity-75">今日抽獎次數</h6>
        <h3 class="card-text">432 次</h3>
        <small>當前在線：15 人</small>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm bg-info text-white">
      <div class="card-body">
        <h6 class="card-title opacity-75">新註冊用戶</h6>
        <h3 class="card-text">28 人</h3>
        <small>目標達成率：85%</small>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card border-0 shadow-sm bg-warning text-dark">
      <div class="card-body">
        <h6 class="card-title opacity-75">隱藏款出貨率</h6>
        <h3 class="card-text">1.5%</h3>
        <small>符合系統設定範圍</small>
      </div>
    </div>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent fw-bold">銷售趨勢分析</div>
      <div class="card-body d-flex justify-content-center align-items-center" style="height: 300px; background: #f8f9fa;">
         <p class="text-muted"><i class="bi bi-bar-chart-line"></i> 這裡是長條圖預留位置 (可結合 Chart.js)</p>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent fw-bold">各系列佔比</div>
      <div class="card-body d-flex justify-content-center align-items-center" style="height: 300px; background: #f8f9fa;">
         <p class="text-muted"><i class="bi bi-pie-chart"></i> 這裡是圓餅圖預留位置</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
