<!doctype html>
<html lang="en" class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽獎注意事項</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <style>
    body {
      background: #081324;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>

<body class="d-flex flex-column h-100 ">
  <img class="position-absolute top-0 w-100 z-0" src="img/bg-top.svg" alt="">
  <nav class="my-5 py-5"></nav>
  <main class="flex-shrink-0 container bg-light rounded-5 my-4 p-4 z-1 mt-5">
    <section class="py-5 px-2">
      <nav class="ms-4" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="#">首頁</a></li>
          <li class="breadcrumb-item"><a href="#">盲盒</a></li>
          <li class="breadcrumb-item active" aria-current="page">確認商品</li>
        </ol>
      </nav>

      <div class="row g-4 mt-4 p-4">
        <div class="text-center mb-5">
          <h2 class="fw-bold">確認商品</h2>
        </div>
        <div class="col-12 text-center p-4 rounded-4" style="background: #F2F2F2;">
        <img class="img-fluid" src="https://picsum.photos/id/311/600/400" alt="">
        </div>
      </div>


      <div class="row g-4 mt-4 p-4">
        <div class="text-center mb-5">
          <h2 class="fw-bold">此次抽獎機率為</h2>
        </div>
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-danger">A</p>
              <p class="text-danger fw-bold">0.5%</p>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-warning">B</p>
              <p class="text-warning fw-bold">2%</p>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-primary">C</p>
              <p class="text-primary fw-bold">5%</p>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-success">D</p>
              <p class="text-success fw-bold">12%</p>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-info">E</p>
              <p class="text-info fw-bold">25%</p>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="text-center p-4 rounded-4 border border-end border-bottom" style="background: #F2F2F2; font-size: 50px;">
              <p class="text-secondary">F</p>
              <p class="text-secondary fw-bold">55.5%</p>
            </div>
          </div>
        </div>

      </div>

      <div class="row g-4 mt-4 p-4">
        <div class="text-center mb-5">
          <h2 class="fw-bold">注意事項</h2>
        </div>
        <div class="col-12 text-center p-4 rounded-4" style="background: #F2F2F2;">
          <p>單抽開獎保護180秒，五連抽開獎保護600秒，十連抽開獎保護780秒，不疊加秒數。</p>
          <p>任何廠商皆無法手動下架已經被抽過獎的賞品，請各位哥們放心，平台罩著 🧙‍♂️</p>
          <p>若該獎品上方出現 🔥，即代表" 所有 "貼上此圖標的獎品" 一起 " 被抽完後才會下架 !</p>
          <p>一番賞、盲盒、扭蛋、特別賞、抽獎型商品皆為「線上機率型」商品 !</p>
          <p>一但完成抽獎程序，恕無法接受「退貨及退款」！🙆‍♂️🙇‍♀️🧏🙋‍♂️🤴🧕👰🤱🙋</p>
        </div>
      </div>

      <div class="text-center mt-5">
        <button class="btn btn-dark btn-lg">
          <i class="bi bi-arrow-right-circle me-2"></i>我已閱讀注意事項
        </button>
      </div>
    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
