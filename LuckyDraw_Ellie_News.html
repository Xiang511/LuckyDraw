    <style>
        /* 使body=瀏覽器高度 */
        html,
        body {
            height: 100%;
        }

        body {
            background-color: darkslategrey;

        }

        /* ====== */

        .layout {
            border-radius: 30px;
        }

        .icon {
            color: rgb(97, 61, 228);
        }

        /* ====== */

        /* ===麵包屑=== */
        .breadcrumb-item.active {
            color: pink;
            font-weight: bolder;
        }

        .breadcrumb-item a {
            color: darksalmon;
            text-decoration: none;
        }

        /* 麵包屑的>符號 */
        .breadcrumb-item+.breadcrumb-item::before {
            color: white;
        }

        /* ====== */

        /* ===slick=== */

        .product-slider .slide-item {
            transition: all 0.3s ease;
            /* 平滑變化 */

            transform: scale(0.9);
            /* 預設縮小 */
        }

        .product-slider .slick-center .slide-inner {
            transform: scale(1.1);
            /* 中間放大 */
            opacity: 1;
            /* 中間不透明 */
            transition: all 0.3s ease;
        }

        .slide-inner {
            overflow: hidden;
            border-radius: 1rem;
            /* 保留圓角 */
            width: 100%;
            height: 100%;
            opacity: 0.6;
            /* 預設透明度 */
        }


        /* ====== */
    </style>


</head>

    <!-- slick js -->
    <script>
        $(document).ready(function () {

            const bp = {
                sm: 576,
                md: 768,
                lg: 992,
                xl: 1200
            };

            $('.product-slider').slick({
                arrows: false,      // 隱藏箭頭
                dots: true,         // 顯示圓點
                infinite: true,     // 無限循環
                speed: 300,
                slidesToShow: 3,    // 最大顯示 3 個
                slidesToScroll: 1,
                autoplay: true,
                centerMode: true,
                centerPadding: '0px',


                responsive: [
                    { breakpoint: bp.lg, settings: { slidesToShow: 3 } },
                    { breakpoint: bp.md, settings: { slidesToShow: 2 } },
                    { breakpoint: bp.sm, settings: { slidesToShow: 1 } }
                ]
            });

        });
    </script>
